<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product details from RJ Ladies Fashion.">
    <title>Product Details | RJ Ladies Fashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <header class="product-header">
        <a class="product-brand" href="index.html" aria-label="RJ Fashion home">RJ <span>Fashion</span></a>
        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to shop</a>
    </header>

    <main id="product-page" class="product-page" aria-live="polite">
        <div class="product-loading"><i class="fa-solid fa-spinner fa-spin"></i><span>Loading product...</span></div>
    </main>

    <div id="mobile-action-bar" class="mobile-action-bar" hidden>
        <div><span>Price</span><strong id="mobile-price"></strong></div>
        <button id="mobile-whatsapp-button" class="whatsapp-button"><i class="fa-brands fa-whatsapp"></i> Order</button>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="checkout.js"></script>
    <script src="product.js" defer></script>
</body>
</html>
